# Temporary Netlify deployment while Vercel is paused (until Aug 1, 2026)
# SWITCH BACK TO VERCEL on Aug 1 — just update DNS and delete this file.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
